server {
    listen 20005;
    listen [::]:20005;
    server_name 39.108.91.166;

    root /var/www/3d-display-shebei/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/3d-display-shebei.access.log;
    error_log /var/log/nginx/3d-display-shebei.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /model/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /sandbox/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
